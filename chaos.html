<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Theory: The Butterfly Effect</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 overflow-hidden h-screen w-screen flex flex-col justify-between p-6 select-none">

    <header class="flex justify-between items-center z-10 pointer-events-none">
        <div>
            <h1 class="text-xl font-semibold tracking-wide text-rose-500">BUTTERFLY EFFECT</h1>
            <p class="text-xs text-stone-500">Microscopic variations $\rightarrow$ Unpredictable chaos.</p>
        </div>
        <div class="text-right">
            <span id="particleCount" class="text-sm font-mono text-stone-400 bg-stone-900/80 px-3 py-1 rounded-full border border-stone-800">Particles: 0</span>
        </div>
    </header>

    <main class="absolute inset-0 w-full h-full">
        <canvas id="chaosCanvas" class="w-full h-full block"></canvas>
    </main>

    <footer class="w-full max-w-xl mx-auto bg-stone-900/70 backdrop-blur-md p-4 rounded-2xl border border-stone-800/80 z-10 flex flex-wrap gap-3 justify-between items-center">
        <p class="text-xs text-stone-400 max-w-xs font-light">
            💡 <strong>Click anywhere</strong> to trigger a burst of particles that start nearly identical but split into chaos.
        </p>
        <div class="flex gap-2">
            <button onclick="clearCanvas()" class="px-4 py-2 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-xl text-xs font-medium transition-all cursor-pointer">
                Clear Trails
            </button>
            <button onclick="resetSimulation()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-medium transition-all cursor-pointer shadow-lg shadow-rose-900/20">
                Reset All
            </button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('chaosCanvas');
        const ctx = canvas.getContext('2d');
        const countDisplay = document.getElementById('particleCount');
        
        let particles = [];
        const gravity = 0.15;
        const friction = 0.999; // Tiny air resistance

        // Resize Canvas to fit screen perfectly
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Draw a dark clean background instantly on resize
            ctx.fillStyle = '#0c0a09';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, vx, vy, hue) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 2;
                this.hue = hue;
                this.alpha = 1;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                // Apply physics
                this.vy += gravity;
                this.vx *= friction;
                this.vy *= friction;
                this.x += this.vx;
                this.y += this.vy;

                // Handle Screen Border Collisions (This causes massive chaotic divergence!)
                // Bounce off left/right
                if (this.x - this.radius <= 0 || this.x + this.radius >= canvas.width) {
                    this.vx *= -1;
                    this.x = this.x <= this.radius ? this.radius : canvas.width - this.radius;
                }
                // Bounce off top/bottom
                if (this.y - this.radius <= 0 || this.y + this.radius >= canvas.height) {
                    this.vy *= -1;
                    this.y = this.y <= this.radius ? this.radius : canvas.height - this.radius;
                }
            }

            draw() {
                // Draw a beautiful glowing trail line connecting old position to new position
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 85%, 60%, 0.25)`;
                ctx.lineWidth = this.radius;
                ctx.stroke();
            }
        }

        // Spawn a cluster of particles with microscopic differences
        function spawnChaosBurst(originX, originY) {
            const baseVx = (Math.random() - 0.5) * 12;
            const baseVy = (Math.random() - 0.5) * 12;
            const sharedHue = Math.random() * 360;

            // Spawn 150 particles
            for(let i = 0; i < 150; i++) {
                // Introduce a tiny variance (e.g., 0.0001 difference in velocity)
                const varianceX = (i * 0.0002);
                const varianceY = (i * 0.0002);

                particles.push(new Particle(
                    originX, 
                    originY, 
                    baseVx + varianceX, 
                    baseVy + varianceY, 
                    (sharedHue + (i * 0.1)) % 360
                ));
            }
            updateCount();
        }

        // Click to spawn
        window.addEventListener('click', (e) => {
            // Ignore clicks on buttons/footer
            if (e.target.closest('footer') || e.target.closest('header')) return;
            spawnChaosBurst(e.clientX, e.clientY);
        });

        function clearCanvas() {
            ctx.fillStyle = '#0c0a09';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function resetSimulation() {
            particles = [];
            clearCanvas();
            updateCount();
        }

        function updateCount() {
            countDisplay.innerText = `Particles: ${particles.length}`;
        }

        // Main Animation Loop
        function animate() {
            // Semi-transparent background refresh creates a trailing fade effect
            ctx.fillStyle = 'rgba(12, 10, 9, 0.02)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        
        // Spawn an initial burst in the center to kick off the look
        setTimeout(() => spawnChaosBurst(canvas.width / 2, canvas.height / 3), 500);
        animate();
    </script>
</body>
</html>
